name: publish

# Runs on a v* tag, gated on the test workflow.
on:
  push:
    tags: ['v*']

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/micropod

permissions:
  contents: read
  packages: write

jobs:
  # gate: tests must pass before publishing
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # alpine has no armv5
          - distro: alpine
            file: Dockerfile.alpine
            platforms: linux/arm64,linux/arm/v7
            arches: arm64 armv7
          # debian adds armv5 (armel)
          - distro: debian
            file: Dockerfile.debian
            platforms: linux/arm64,linux/arm/v7,linux/arm/v5
            arches: arm64 armv7 armv5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # skip binfmt/buildx caching: cheap to fetch, only races the gha key
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      # cache-from = the same per-arch scopes test wrote
      - name: Compute cache scopes
        id: cache
        run: |
          h=$(git rev-parse "HEAD:rootfs" "HEAD:${{ matrix.file }}" | sha256sum | cut -c1-16)
          {
            echo "from<<EOF"
            for a in ${{ matrix.arches }}; do echo "type=gha,scope=${h}-${a}"; done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # set latest explicitly below, not auto from the semver tag
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.distro }}
            type=semver,pattern={{version}},suffix=-${{ matrix.distro }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.distro }}
            # latest -> debian (the only variant with armv5)
            type=raw,value=latest,enable=${{ matrix.distro == 'debian' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # plain manifest list (no attestation): RouterOS' pull is picky
          provenance: false
          sbom: false
          # no cache-to: test is the producer
          cache-from: ${{ steps.cache.outputs.from }}
