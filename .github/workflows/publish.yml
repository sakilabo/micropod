name: publish

# Manual-only. Builds the multi-arch images and pushes them to GHCR, gated on
# the test workflow passing. Dispatch this from the Actions tab (or
# `gh workflow run publish.yml --ref <branch-or-tag>`):
#   - from a `v*` tag  -> also emits version tags (e.g. 0.1.0-*, 0.1-*)
#   - from any ref     -> updates the rolling alpine/debian/latest tags
on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/micropod

permissions:
  contents: read
  packages: write

jobs:
  # Re-run the smoke tests as a gate before any push.
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Alpine has no armv5 build — arm64 + armv7 only.
          - distro: alpine
            file: Dockerfile.alpine
            platforms: linux/arm64,linux/arm/v7
          # Debian (slim) carries armv5 (armel) in addition.
          - distro: debian
            file: Dockerfile.debian
            platforms: linux/arm64,linux/arm/v7,linux/arm/v5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags & labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ matrix.distro }}
            type=semver,pattern={{version}},suffix=-${{ matrix.distro }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.distro }}
            # `latest` points at alpine (smallest); manual publish only.
            type=raw,value=latest,enable=${{ matrix.distro == 'alpine' }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Emit a plain multi-arch manifest list, without the extra
          # attestation/provenance manifests. RouterOS' container pull is
          # picky about manifests it doesn't recognise, so keep it clean.
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
