name: test

# Also the gate publish.yml runs before a release (workflow_call).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitattributes'
      - '.gitignore'
      - '.vscode/**'
      - 'build/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitattributes'
      - '.gitignore'
      - '.vscode/**'
      - 'build/**'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: alpine, file: Dockerfile.alpine, platform: linux/arm64,  arch: arm64 }
          - { distro: alpine, file: Dockerfile.alpine, platform: linux/arm/v7, arch: armv7 }
          - { distro: debian, file: Dockerfile.debian, platform: linux/arm64,  arch: arm64 }
          - { distro: debian, file: Dockerfile.debian, platform: linux/arm/v7, arch: armv7 }
          - { distro: debian, file: Dockerfile.debian, platform: linux/arm/v5, arch: armv5 }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # scope = hash(Dockerfile+rootfs)+arch. Per-arch because a gha key is
      # single-writer: parallel legs can't share one scope.
      - name: Compute cache scope
        id: cache
        run: echo "hash=$(git rev-parse "HEAD:rootfs" "HEAD:${{ matrix.file }}" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # skip binfmt/buildx caching: cheap to fetch, only races the gha key
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Build base for ${{ matrix.platform }} (load)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          load: true
          provenance: false
          tags: micropod:test
          cache-from: type=gha,scope=${{ steps.cache.outputs.hash }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.cache.outputs.hash }}-${{ matrix.arch }}

      - name: Smoke test (boot s6, supervise a service, graceful stop)
        run: |
          set -euo pipefail
          # a sample s6 service, dropped into the scan dir at runtime
          mkdir -p svc/hello
          printf '#!/bin/sh\necho "micropod: hello started"\nexec tail -f /dev/null\n' > svc/hello/run
          chmod 0755 svc/hello/run

          docker run -d --platform "${{ matrix.platform }}" \
            -v "$PWD/svc/hello:/etc/s6/sv/hello" --name mp micropod:test

          # poll up to ~30s. match captured output with `case`; piping into
          # `grep -q` SIGPIPEs the producer -> exit 141 under pipefail.
          for _ in $(seq 30); do
            logs=$(docker logs mp 2>&1)
            case "$logs" in *"micropod: hello started"*) break;; esac
            sleep 1
          done
          top=$(docker top mp || true)

          echo "=== logs ==="; printf '%s\n' "$logs"
          echo "=== top ===";  printf '%s\n' "$top"

          case "$logs" in *"micropod: hello started"*) ;; *) echo "FAIL: no service log";  exit 1;; esac
          case "$top"  in *s6-svscan*)                 ;; *) echo "FAIL: no s6-svscan";    exit 1;; esac
          case "$top"  in *s6-supervise*)              ;; *) echo "FAIL: no s6-supervise"; exit 1;; esac

          # graceful stop: SIGTERM to PID1 (s6-svscan) -> .s6-svscan/SIGTERM
          # -> s6-svscanctl -t, before the SIGKILL timeout.
          t0=$(date +%s); docker stop -t 20 mp >/dev/null; t1=$(date +%s)
          echo "stop took $((t1 - t0))s"
          test $((t1 - t0)) -lt 15

          docker rm -f mp >/dev/null
          echo "PASS ${{ matrix.distro }} ${{ matrix.platform }}"
