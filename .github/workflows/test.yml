name: test

# Smoke-test each architecture (incl. armv5 under QEMU). The base must boot
# busybox init -> s6-svscan, supervise a service, and stop cleanly. Runs on
# push/tag/PR; also reused by publish.yml (workflow_call) to gate publishing.
# This workflow never pushes images — publishing is manual (see publish.yml).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: alpine, file: Dockerfile.alpine, platform: linux/arm64,  arch: arm64 }
          - { distro: alpine, file: Dockerfile.alpine, platform: linux/arm/v7, arch: armv7 }
          - { distro: debian, file: Dockerfile.debian, platform: linux/arm64,  arch: arm64 }
          - { distro: debian, file: Dockerfile.debian, platform: linux/arm/v7, arch: armv7 }
          # armv5 is debian-only; runs under QEMU (qemu-arm), as on a device.
          - { distro: debian, file: Dockerfile.debian, platform: linux/arm/v5, arch: armv5 }
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Cache scope = git hash of the build inputs (this distro's Dockerfile +
      # rootfs) + arch. Same source -> same hash, so the same commit's test and
      # the later release reuse the same layers (identical packages); a source
      # change rotates it. The arch suffix is required: a gha cache key is
      # single-writer, so parallel legs can't share one scope — only one would
      # win the reserve and the rest fail to store.
      - name: Compute cache scope
        id: cache
        run: echo "hash=$(git rev-parse "HEAD:rootfs" "HEAD:${{ matrix.file }}" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      # binfmt image / buildx binary are cheap to fetch; caching them only
      # races the immutable gha key (the "Unable to reserve cache" notices)
      # for no real gain. The build LAYER cache below is the one worth keeping.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          cache-binary: false

      - name: Build base for ${{ matrix.platform }} (load)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platform }}
          load: true
          provenance: false
          tags: micropod:test
          cache-from: type=gha,scope=${{ steps.cache.outputs.hash }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ steps.cache.outputs.hash }}-${{ matrix.arch }}

      - name: Smoke test (boot s6, supervise a service, graceful stop)
        run: |
          set -euo pipefail
          # a sample s6 service, dropped into the scan dir at runtime
          mkdir -p svc/hello
          printf '#!/bin/sh\necho "micropod: hello started"\nexec tail -f /dev/null\n' > svc/hello/run
          chmod 0755 svc/hello/run

          docker run -d --platform "${{ matrix.platform }}" \
            -v "$PWD/svc/hello:/etc/s6/sv/hello" --name mp micropod:test

          # QEMU is slow — poll for the service to come up (up to ~30s).
          # Capture output and match with `case`; never pipe a producer into
          # `grep -q`, which exits on first match and SIGPIPEs the producer ->
          # exit 141 under `set -o pipefail` (a timing/arch-dependent race).
          for _ in $(seq 30); do
            logs=$(docker logs mp 2>&1)
            case "$logs" in *"micropod: hello started"*) break;; esac
            sleep 1
          done
          top=$(docker top mp || true)

          echo "=== logs ==="; printf '%s\n' "$logs"
          echo "=== top ===";  printf '%s\n' "$top"

          case "$logs" in *"micropod: hello started"*) ;; *) echo "FAIL: no service log";  exit 1;; esac
          case "$top"  in *s6-svscan*)                 ;; *) echo "FAIL: no s6-svscan";    exit 1;; esac
          case "$top"  in *s6-supervise*)              ;; *) echo "FAIL: no s6-supervise"; exit 1;; esac

          # graceful stop: the default entrypoint runs s6-svscan as PID 1, so
          # SIGTERM (RouterOS stop / `docker stop`) fires .s6-svscan/SIGTERM ->
          # s6-svscanctl -t, bringing services down before the SIGKILL timeout.
          t0=$(date +%s); docker stop -t 20 mp >/dev/null; t1=$(date +%s)
          echo "stop took $((t1 - t0))s"
          test $((t1 - t0)) -lt 15

          docker rm -f mp >/dev/null
          echo "PASS ${{ matrix.distro }} ${{ matrix.platform }}"
